<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Delicia - Contact</title>
    <link rel="stylesheet" href="../css/style.css"> 
</head>
<body>
    <nav class="navbar">
        <div class="logo">Cafe Delicia</div>
        <ul class="nav-links" id="navLinks">
            <li><a href="../index.html">Inicio</a></li> 
            <li><a href="../page/about.html">About</a></li> 
            <li><a href="../page/services.html">Service</a></li> 
            <li><a href="../page/gallery.html">Gallery</a></li> 
            <li><a href="../page/contact.html">Contact</a></li> 
        </ul>
        <div class="hamburger" id="hamburger">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </nav>
    
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const hamburger = document.getElementById("hamburger");
            const navLinks = document.getElementById("navLinks");
            
            hamburger.addEventListener("click", function () {
                navLinks.classList.toggle("active");
            });
        });
    </script>

    <main>
        <section class="content-section contact-section">
            <h2>Contáctanos</h2>
            <p>Estamos en Calle 45 #23-12, Bogotá. ¡Escríbenos o visítanos!</p>
            <div class="contact-container">
                <form class="contact-form">
                    <div class="form-group">
                        <label for="name">Nombre:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Correo:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Mensaje:</label>
                        <textarea id="message" name="message" required></textarea>
                    </div>
                    <button type="submit" class="btn">Enviar</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2025 Café Delicia. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
